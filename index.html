<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropTracker PRO - Collaborative Game Events & Battle Passes</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, setDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
      getFirestore, collection, onSnapshot, addDoc, setDoc, deleteDoc, doc, updateDoc
    };
    window.dispatchEvent(new Event('firebase-loaded'));
  </script>

  <!-- Main React App Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PRESET_COLORS = [
      '#e11d48', // Rose
      '#9333ea', // Purple
      '#f59e0b', // Amber
      '#10b981', // Emerald
      '#06b6d4', // Cyan
      '#d946ef', // Fuchsia
      '#ef4444', // Red
      '#3b82f6'  // Blue
    ];

    const CATEGORIES = {
      'LTM': { label: 'Limited Time Mode', defaultColor: '#e11d48' },
      'Battle Pass': { label: 'Battle Pass', defaultColor: '#f59e0b' },
      'Seasonal Event': { label: 'Seasonal Event', defaultColor: '#9333ea' },
      'Double XP': { label: 'Double XP Weekend', defaultColor: '#10b981' }
    };

    const getDefaultEvents = () => {
      const now = new Date();
      const addDays = (date, days) => {
        const res = new Date(date);
        res.setDate(res.getDate() + days);
        return res;
      };
      const formatLocalISO = (d) => {
        const pad = (n) => n.toString().padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      return [
        {
          game: 'Rainbow Six Siege',
          title: '3v3 Arcade LTM: Close Quarters',
          category: 'LTM',
          startDate: formatLocalISO(addDays(now, -3)),
          endDate: formatLocalISO(addDays(now, 5)),
          description: 'Fast-paced 3v3 tactical shootout on compact maps with forced close-quarters loadouts and instant respawns.',
          color: '#e11d48',
          tags: ['3v3', 'Arcade', 'Exclusive Skin'],
          order: 1
        },
        {
          game: 'Dead by Daylight',
          title: '2v8 Game Mode: Entity Unleashed',
          category: 'LTM',
          startDate: formatLocalISO(addDays(now, -2)),
          endDate: formatLocalISO(addDays(now, 10)),
          description: '2 Killers team up against 8 Survivors in expanded trial arenas featuring dynamic roles and fast-paced cages.',
          color: '#9333ea',
          tags: ['2v8 Mode', 'Chaos Trial', 'Double BP'],
          order: 2
        },
        {
          game: 'Apex Legends',
          title: 'Season 22 Battle Pass',
          category: 'Battle Pass',
          startDate: formatLocalISO(addDays(now, -18)),
          endDate: formatLocalISO(addDays(now, 22)),
          description: 'Complete 110 tiers to earn reactive weapon cosmetics, legend skins, Apex Packs, and music packs.',
          color: '#f59e0b',
          tags: ['Battle Pass', '110 Tiers', 'Reactive Flatline'],
          order: 3
        },
        {
          game: 'Sea of Thieves',
          title: 'Season 16 Plunder Pass',
          category: 'Battle Pass',
          startDate: formatLocalISO(addDays(now, -12)),
          endDate: formatLocalISO(addDays(now, 14)),
          description: 'Earn exclusive Pirate Legend cosmetics, Ancient Coins, curse skins, and full ship set vanity items.',
          color: '#10b981',
          tags: ['Plunder Pass', 'Ancient Coins', 'Ship Cosmetics'],
          order: 4
        }
      ];
    };

    const calculateEventStatus = (startDate, endDate) => {
      const now = new Date().getTime();
      const start = new Date(startDate).getTime();
      const end = new Date(endDate).getTime();

      if (now < start) {
        const diff = start - now;
        return { status: 'UPCOMING', label: 'Starts In', targetDate: startDate, progress: 0, diff };
      } else if (now >= start && now <= end) {
        const totalDuration = end - start;
        const elapsed = now - start;
        const progress = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
        return { status: 'LIVE', label: 'Ends In', targetDate: endDate, progress, diff: end - now };
      } else {
        return { status: 'ENDED', label: 'Ended', targetDate: endDate, progress: 100, diff: 0 };
      }
    };

    const formatTimeDiff = (ms) => {
      if (ms <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0 };
      const seconds = Math.floor((ms / 1000) % 60);
      const minutes = Math.floor((ms / (1000 * 60)) % 60);
      const hours = Math.floor((ms / (1000 * 60 * 60)) % 24);
      const days = Math.floor(ms / (1000 * 60 * 60 * 24));
      return { days, hours, minutes, seconds };
    };

    const padZero = (num) => num.toString().padStart(2, '0');

    function App() {
      const [user, setUser] = useState(null);
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);

      const [viewMode, setViewMode] = useState('timers');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedGame, setSelectedGame] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedStatus, setSelectedStatus] = useState('ALL');
      const [showEnded, setShowEnded] = useState(true);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [viewingEvent, setViewingEvent] = useState(null);

      useEffect(() => {
        const handleFirebaseReady = () => {
          if (!window.FirebaseSDK) return;
          try {
            // If running standalone without env config, fallback to local state or demo config
            const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (!configStr) {
              setEvents(getDefaultEvents());
              setLoading(false);
              return;
            }

            const firebaseConfig = JSON.parse(configStr);
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, onSnapshot, addDoc } = window.FirebaseSDK;
            
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'droptracker-pro-default';

            const initAuth = async () => {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            };
            initAuth();

            onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'game_events_v3');
                onSnapshot(colRef, (snapshot) => {
                  const loadedEvents = [];
                  snapshot.forEach((docSnap) => {
                    loadedEvents.push({ id: docSnap.id, ...docSnap.data() });
                  });

                  if (loadedEvents.length === 0) {
                    const defaults = getDefaultEvents();
                    defaults.forEach(async (d, index) => {
                      await addDoc(colRef, { ...d, order: index });
                    });
                  } else {
                    loadedEvents.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
                    setEvents(loadedEvents);
                  }
                  setLoading(false);
                }, (err) => {
                  console.error(err);
                  setLoading(false);
                });
              }
            });
          } catch (e) {
            console.error(e);
            setEvents(getDefaultEvents());
            setLoading(false);
          }
        };

        if (window.FirebaseSDK) {
          handleFirebaseReady();
        } else {
          window.addEventListener('firebase-loaded', handleFirebaseReady);
          // Fallback timer if firebase script takes too long
          setTimeout(() => {
            if (loading) {
              setEvents(getDefaultEvents());
              setLoading(false);
            }
          }, 2000);
        }
      }, []);

      const gamesList = useMemo(() => ['ALL', ...Array.from(new Set(events.map(e => e.game))).filter(Boolean)], [events]);

      const filteredEvents = useMemo(() => {
        return events.filter(event => {
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || event.game.toLowerCase().includes(q) || event.title.toLowerCase().includes(q) || (event.tags && event.tags.some(t => t.toLowerCase().includes(q)));
          const matchesGame = selectedGame === 'ALL' || event.game === selectedGame;
          const matchesCategory = selectedCategory === 'ALL' || event.category === selectedCategory;
          const statusInfo = calculateEventStatus(event.startDate, event.endDate);
          const matchesStatus = selectedStatus === 'ALL' || statusInfo.status === selectedStatus;
          const matchesEnded = showEnded || statusInfo.status !== 'ENDED';
          return matchesSearch && matchesGame && matchesCategory && matchesStatus && matchesEnded;
        });
      }, [events, searchQuery, selectedGame, selectedCategory, selectedStatus, showEnded]);

      const liveEvents = useMemo(() => filteredEvents.filter(e => calculateEventStatus(e.startDate, e.endDate).status === 'LIVE'), [filteredEvents]);
      const upcomingEvents = useMemo(() => filteredEvents.filter(e => calculateEventStatus(e.startDate, e.endDate).status === 'UPCOMING'), [filteredEvents]);
      const endedEvents = useMemo(() => filteredEvents.filter(e => calculateEventStatus(e.startDate, e.endDate).status === 'ENDED'), [filteredEvents]);

      const handleSaveEvent = async (eventData) => {
        try {
          if (window.FirebaseSDK && typeof __firebase_config !== 'undefined') {
            const { getFirestore, collection, addDoc, updateDoc, doc } = window.FirebaseSDK;
            const db = getFirestore();
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'droptracker-pro-default';
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'game_events_v3');

            if (eventData.id) {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'game_events_v3', eventData.id);
              const { id, ...rest } = eventData;
              await updateDoc(docRef, rest);
            } else {
              const maxOrder = events.length > 0 ? Math.max(...events.map(e => e.order || 0)) + 1 : 0;
              await addDoc(colRef, { ...eventData, order: maxOrder });
            }
          } else {
            // Local state mode fallback
            if (eventData.id) {
              setEvents(events.map(e => e.id === eventData.id ? eventData : e));
            } else {
              const newEvt = { ...eventData, id: 'local_' + Date.now(), order: events.length };
              setEvents([...events, newEvt]);
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleDeleteEvent = async (id) => {
        try {
          if (window.FirebaseSDK && typeof __firebase_config !== 'undefined') {
            const { getFirestore, deleteDoc, doc } = window.FirebaseSDK;
            const db = getFirestore();
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'droptracker-pro-default';
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'game_events_v3', id));
          } else {
            setEvents(events.filter(e => e.id !== id));
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleDuplicateEvent = async (event) => {
        const { id, ...rest } = event;
        await handleSaveEvent({ ...rest, title: `${event.title} (Copy)`, order: events.length });
      };

      const handleSwapEvents = async (id1, id2) => {
        const i1 = events.findIndex(e => e.id === id1);
        const i2 = events.findIndex(e => e.id === id2);
        if (i1 === -1 || i2 === -1) return;

        const newEvents = [...events];
        const tempOrder = newEvents[i1].order;
        newEvents[i1].order = newEvents[i2].order;
        newEvents[i2].order = tempOrder;

        [newEvents[i1], newEvents[i2]] = [newEvents[i2], newEvents[i1]];
        setEvents(newEvents);

        try {
          if (window.FirebaseSDK && typeof __firebase_config !== 'undefined') {
            const { getFirestore, updateDoc, doc } = window.FirebaseSDK;
            const db = getFirestore();
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'droptracker-pro-default';
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'game_events_v3', newEvents[i1].id), { order: newEvents[i1].order });
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'game_events_v3', newEvents[i2].id), { order: newEvents[i2].order });
          }
        } catch (e) {
          console.error(e);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500/30 pb-16">
          <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-gradient-to-tr from-indigo-600 to-purple-600 p-2.5 rounded-xl shadow-lg shadow-indigo-900/30 border border-indigo-500/30">
                  <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                  <h1 className="text-lg sm:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-indigo-300">
                    DropTracker <span className="text-indigo-400 font-extrabold">PRO</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-emerald-950/50 border border-emerald-500/30 rounded-full text-xs text-emerald-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>Cloud Synced</span>
                </div>

                <div className="hidden md:flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                  <button onClick={() => setViewMode('timers')} className={`flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${viewMode === 'timers' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                    Timers
                  </button>
                  <button onClick={() => setViewMode('calendar')} className={`flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${viewMode === 'calendar' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                    Calendar Spans
                  </button>
                </div>
                <button onClick={() => { setEditingEvent(null); setIsModalOpen(true); }} className="flex items-center px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all shadow-lg border border-indigo-400/30">
                  + Add Event
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            <div className="md:hidden flex bg-slate-900 p-1 rounded-xl border border-slate-800 mb-4">
              <button onClick={() => setViewMode('timers')} className={`flex-1 flex justify-center py-2 rounded-lg text-xs font-semibold ${viewMode === 'timers' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Timers</button>
              <button onClick={() => setViewMode('calendar')} className={`flex-1 flex justify-center py-2 rounded-lg text-xs font-semibold ${viewMode === 'calendar' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Calendar Spans</button>
            </div>

            <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 shadow-xl mb-8 space-y-3">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <input type="text" placeholder="Search..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <select value={selectedGame} onChange={(e) => setSelectedGame(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  {gamesList.map(g => <option key={g} value={g}>{g === 'ALL' ? 'All Games' : g}</option>)}
                </select>
                <select value={selectedCategory} onChange={(e) => setSelectedCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="ALL">All Categories</option>
                  {Object.entries(CATEGORIES).map(([key, val]) => <option key={key} value={key}>{val.label}</option>)}
                </select>
                <select value={selectedStatus} onChange={(e) => setSelectedStatus(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="ALL">All Statuses</option>
                  <option value="LIVE">Live Now</option>
                  <option value="UPCOMING">Upcoming</option>
                  <option value="ENDED">Ended</option>
                </select>
              </div>
              <div className="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/60">
                <button onClick={() => setShowEnded(!showEnded)} className="hover:text-white transition-colors">
                  {showEnded ? '👁️ Showing Past Events' : '🙈 Hiding Past Events'}
                </button>
                <span>Showing {filteredEvents.length} events</span>
              </div>
            </div>

            {loading ? (
              <div className="text-center py-20 bg-slate-900/50 rounded-2xl border border-slate-800">
                <div className="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-3"></div>
                <p className="text-sm text-slate-400">Loading events...</p>
              </div>
            ) : filteredEvents.length === 0 ? (
              <div className="text-center py-20 bg-slate-900/50 rounded-2xl border border-slate-800 border-dashed">
                <h3 className="text-lg font-bold text-white">No matching events found</h3>
              </div>
            ) : viewMode === 'timers' ? (
              <div className="space-y-10">
                {liveEvents.length > 0 && (
                  <section>
                    <h2 className="text-lg font-bold text-white flex items-center gap-2 mb-4">🔥 LIVE NOW</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {liveEvents.map((event, idx) => (
                        <TimerCard key={event.id} event={event} 
                          onMoveLeft={idx > 0 ? () => handleSwapEvents(event.id, liveEvents[idx-1].id) : null}
                          onMoveRight={idx < liveEvents.length - 1 ? () => handleSwapEvents(event.id, liveEvents[idx+1].id) : null}
                          onEdit={(e) => { setEditingEvent(e); setIsModalOpen(true); }} onDelete={handleDeleteEvent} onDuplicate={handleDuplicateEvent} onViewDetails={setViewingEvent} 
                        />
                      ))}
                    </div>
                  </section>
                )}
                {upcomingEvents.length > 0 && (
                  <section>
                    <h2 className="text-lg font-bold text-white flex items-center gap-2 mb-4">⏰ UPCOMING EVENTS</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {upcomingEvents.map((event, idx) => (
                        <TimerCard key={event.id} event={event} 
                          onMoveLeft={idx > 0 ? () => handleSwapEvents(event.id, upcomingEvents[idx-1].id) : null}
                          onMoveRight={idx < upcomingEvents.length - 1 ? () => handleSwapEvents(event.id, upcomingEvents[idx+1].id) : null}
                          onEdit={(e) => { setEditingEvent(e); setIsModalOpen(true); }} onDelete={handleDeleteEvent} onDuplicate={handleDuplicateEvent} onViewDetails={setViewingEvent} 
                        />
                      ))}
                    </div>
                  </section>
                )}
                {showEnded && endedEvents.length > 0 && (
                  <section className="opacity-80">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2 mb-4">✔️ PAST EVENTS</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {endedEvents.map((event, idx) => (
                        <TimerCard key={event.id} event={event} 
                          onMoveLeft={idx > 0 ? () => handleSwapEvents(event.id, endedEvents[idx-1].id) : null}
                          onMoveRight={idx < endedEvents.length - 1 ? () => handleSwapEvents(event.id, endedEvents[idx+1].id) : null}
                          onEdit={(e) => { setEditingEvent(e); setIsModalOpen(true); }} onDelete={handleDeleteEvent} onDuplicate={handleDuplicateEvent} onViewDetails={setViewingEvent} 
                        />
                      ))}
                    </div>
                  </section>
                )}
              </div>
            ) : (
              <MultiDayCalendarView events={filteredEvents} onViewDetails={setViewingEvent} />
            )}
          </main>

          <AddEditEventModal isOpen={isModalOpen} onClose={() => { setIsModalOpen(false); setEditingEvent(null); }} onSave={handleSaveEvent} initialData={editingEvent} />
          <EventDetailsModal event={viewingEvent} onClose={() => setViewingEvent(null)} onEdit={(e) => { setEditingEvent(e); setIsModalOpen(true); }} onDelete={handleDeleteEvent} onDuplicate={handleDuplicateEvent} />
        </div>
      );
    }

    const TimerCard = ({ event, onEdit, onDelete, onDuplicate, onViewDetails, onMoveLeft, onMoveRight }) => {
      const [now, setNow] = useState(new Date().getTime());

      useEffect(() => {
        const interval = setInterval(() => setNow(new Date().getTime()), 1000);
        return () => clearInterval(interval);
      }, []);

      const statusInfo = calculateEventStatus(event.startDate, event.endDate);
      const time = formatTimeDiff(statusInfo.diff);
      const color = event.color || '#e11d48';

      return (
        <div className="relative group rounded-2xl bg-slate-900 border overflow-hidden shadow-xl hover:shadow-2xl transition-all duration-300 flex flex-col" style={{ borderColor: `${color}40` }}>
          <div className="h-2.5 w-full" style={{ background: `linear-gradient(to right, ${color}, transparent)` }} />
          <div className="p-5 flex-grow flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between gap-2 mb-3">
                <span className="inline-flex items-center text-xs font-semibold px-2.5 py-1 rounded-full border" style={{ backgroundColor: `${color}20`, color: color, borderColor: `${color}40` }}>
                  {event.category}
                </span>
                <div className="flex items-center gap-2">
                  <div className="flex items-center bg-slate-950/50 rounded-md border border-slate-800 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onClick={onMoveLeft} disabled={!onMoveLeft} className="p-1 text-slate-400 hover:text-white disabled:opacity-30">◄</button>
                    <button onClick={onMoveRight} disabled={!onMoveRight} className="p-1 text-slate-400 hover:text-white disabled:opacity-30">►</button>
                  </div>
                  {statusInfo.status === 'LIVE' && <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 animate-pulse">LIVE</span>}
                  {statusInfo.status === 'UPCOMING' && <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30">UPCOMING</span>}
                  {statusInfo.status === 'ENDED' && <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">ENDED</span>}
                </div>
              </div>

              <div className="mb-4">
                <h4 className="text-xs font-semibold uppercase" style={{ color: color }}>{event.game}</h4>
                <h3 onClick={() => onViewDetails(event)} className="text-lg font-bold text-white mt-1 hover:text-indigo-300 cursor-pointer transition-colors">{event.title}</h3>
              </div>

              {statusInfo.status !== 'ENDED' ? (
                <div className="mb-4">
                  <div className="text-xs text-slate-400 mb-2 flex justify-between">
                    <span>{statusInfo.label}</span>
                    <span className="font-mono">{new Date(statusInfo.targetDate).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                  </div>
                  <div className="grid grid-cols-4 gap-2 text-center">
                    <div className="bg-slate-950 rounded-lg p-2 border border-slate-800"><div className="text-xl font-bold font-mono">{padZero(time.days)}</div><div className="text-[10px] uppercase text-slate-400">Days</div></div>
                    <div className="bg-slate-950 rounded-lg p-2 border border-slate-800"><div className="text-xl font-bold font-mono">{padZero(time.hours)}</div><div className="text-[10px] uppercase text-slate-400">Hours</div></div>
                    <div className="bg-slate-950 rounded-lg p-2 border border-slate-800"><div className="text-xl font-bold font-mono">{padZero(time.minutes)}</div><div className="text-[10px] uppercase text-slate-400">Mins</div></div>
                    <div className="bg-slate-950 rounded-lg p-2 border border-slate-800"><div className="text-xl font-bold font-mono">{padZero(time.seconds)}</div><div className="text-[10px] uppercase text-slate-400">Secs</div></div>
                  </div>
                </div>
              ) : (
                <div className="mb-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-center text-sm text-slate-400">
                  Ended on {new Date(event.endDate).toLocaleDateString()}
                </div>
              )}
            </div>

            <div className="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
              <button onClick={() => onViewDetails(event)} className="hover:text-indigo-400">Details</button>
              <div className="flex space-x-1">
                <button onClick={() => onDuplicate(event)} className="p-1.5 hover:text-indigo-300" title="Duplicate">📋</button>
                <button onClick={() => onEdit(event)} className="p-1.5 hover:text-yellow-300" title="Edit">✏️</button>
                <button onClick={() => onDelete(event.id)} className="p-1.5 hover:text-red-400" title="Delete">🗑️</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const MultiDayCalendarView = ({ events, onViewDetails }) => {
      const [currentDate, setCurrentDate] = useState(() => {
        const d = new Date();
        return new Date(d.getFullYear(), d.getMonth(), 1);
      });

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));
      const goToToday = () => {
        const d = new Date();
        setCurrentDate(new Date(d.getFullYear(), d.getMonth(), 1));
      };

      const firstDayOfWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const calendarCells = useMemo(() => {
        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) cells.push({ type: 'prev', dayNum: null, date: null });
        for (let day = 1; day <= daysInMonth; day++) {
          const cellDate = new Date(year, month, day);
          cellDate.setHours(0, 0, 0, 0);
          cells.push({ type: 'current', dayNum: day, date: cellDate });
        }
        while (cells.length % 7 !== 0) cells.push({ type: 'next', dayNum: null, date: null });
        return cells;
      }, [year, month, firstDayOfWeek, daysInMonth]);

      const getEventsForCell = (cellDate) => {
        if (!cellDate) return [];
        const cellTime = cellDate.getTime();
        const cellEnd = cellTime + (24 * 60 * 60 * 1000) - 1;

        return events.filter(event => {
          const start = new Date(event.startDate).getTime();
          const end = new Date(event.endDate).getTime();
          return start <= cellEnd && end >= cellTime;
        }).map(event => {
          const start = new Date(event.startDate);
          const end = new Date(event.endDate);
          const startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate()).getTime();
          const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate()).getTime();
          
          return {
            ...event,
            isStart: cellTime === startDay,
            isEnd: cellTime === endDay
          };
        });
      };

      const isTodayCell = (cellDate) => {
        if (!cellDate) return false;
        const today = new Date();
        return cellDate.getDate() === today.getDate() &&
               cellDate.getMonth() === today.getMonth() &&
               cellDate.getFullYear() === today.getFullYear();
      };

      return (
        <div className="bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden">
          <div className="p-4 sm:p-6 border-b border-slate-800 bg-slate-950/60 flex flex-wrap items-center justify-between gap-4">
            <h2 className="text-xl sm:text-2xl font-bold text-white">
              {monthNames[month]} <span className="text-slate-400">{year}</span>
            </h2>
            <div className="flex items-center space-x-2">
              <button onClick={goToToday} className="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg">Today</button>
              <div className="flex items-center bg-slate-800 p-0.5 rounded-lg">
                <button onClick={prevMonth} className="p-1.5 text-slate-300 hover:text-white">◀</button>
                <button onClick={nextMonth} className="p-1.5 text-slate-300 hover:text-white">▶</button>
              </div>
            </div>
          </div>

          <div className="overflow-x-auto">
            <div className="min-w-[750px] w-full">
              <div className="grid grid-cols-7 border-b border-slate-800 bg-slate-950/40">
                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                  <div key={day} className="py-3 text-center text-xs font-bold text-slate-400 uppercase">{day}</div>
                ))}
              </div>

              <div className="grid grid-cols-7 bg-slate-800/40 gap-px">
                {calendarCells.map((cell, idx) => {
                  const dayEvents = getEventsForCell(cell.date);
                  const isToday = isTodayCell(cell.date);

                  return (
                    <div key={idx} className={`min-h-[135px] p-2 bg-slate-900 flex flex-col justify-start ${cell.type !== 'current' ? 'opacity-30 bg-slate-950/50' : 'hover:bg-slate-800/60'}`}>
                      {cell.dayNum && (
                        <div className="flex items-center justify-between mb-1.5">
                          <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-300'}`}>{cell.dayNum}</span>
                        </div>
                      )}
                      <div className="space-y-1 overflow-y-auto max-h-[100px]">
                        {dayEvents.map(event => (
                          <div
                            key={event.id}
                            onClick={() => onViewDetails(event)}
                            className={`text-[11px] py-1 px-1.5 cursor-pointer font-semibold flex items-center justify-between border ${
                              event.isStart && event.isEnd ? 'rounded-md' : event.isStart ? 'rounded-l-md border-r-0' : event.isEnd ? 'rounded-r-md border-l-0' : 'rounded-none border-x-0'
                            }`}
                            style={{ backgroundColor: event.color, borderColor: 'rgba(0,0,0,0.2)', color: '#ffffff', textShadow: '0 1px 2px rgba(0,0,0,0.6)' }}
                          >
                            <span className="truncate">{event.isStart ? `${event.game}` : event.title}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const AddEditEventModal = ({ isOpen, onClose, onSave, initialData }) => {
      const [formData, setFormData] = useState({
        game: '', title: '', category: 'LTM', startDate: '', endDate: '', description: '', color: '#e11d48', tags: ''
      });

      useEffect(() => {
        if (initialData) {
          setFormData({ ...initialData, tags: Array.isArray(initialData.tags) ? initialData.tags.join(', ') : (initialData.tags || '') });
        } else {
          const now = new Date();
          const end = new Date();
          end.setDate(now.getDate() + 7);
          const formatISO = (d) => {
            const pad = (n) => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
          };
          setFormData({ game: '', title: '', category: 'LTM', startDate: formatISO(now), endDate: formatISO(end), description: '', color: '#e11d48', tags: '' });
        }
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.game.trim() || !formData.title.trim() || !formData.startDate || !formData.endDate) return;
        const tagsArray = formData.tags ? formData.tags.split(',').map(t => t.trim()).filter(Boolean) : ['In-Game Event'];
        onSave({ ...formData, tags: tagsArray });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-xl border border-slate-800 overflow-hidden">
            <div className="flex items-center justify-between p-5 border-b border-slate-800 bg-slate-950">
              <h2 className="text-lg font-bold text-white">{initialData ? 'Edit Event' : 'Create New Event'}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Game Title *</label>
                  <input type="text" required value={formData.game} onChange={(e) => setFormData({...formData, game: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white" />
                </div>
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Category</label>
                  <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value, color: CATEGORIES[e.target.value]?.defaultColor || formData.color})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white">
                    {Object.entries(CATEGORIES).map(([key, val]) => <option key={key} value={key}>{val.label}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Event Title *</label>
                <input type="text" required value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Start Date *</label>
                  <input type="datetime-local" required value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white [color-scheme:dark]" />
                </div>
                <div>
                  <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">End Date *</label>
                  <input type="datetime-local" required value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white [color-scheme:dark]" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Color Theme</label>
                <div className="flex items-center gap-3 bg-slate-950 border border-slate-700 rounded-xl p-2">
                  <input type="color" value={formData.color} onChange={(e) => setFormData({...formData, color: e.target.value})} className="w-10 h-10 bg-transparent cursor-pointer" />
                  <div className="flex gap-2">
                    {PRESET_COLORS.map(c => <button key={c} type="button" onClick={() => setFormData({...formData, color: c})} className="w-6 h-6 rounded-full border border-white/20" style={{backgroundColor: c}} />)}
                  </div>
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Description</label>
                <textarea rows="3" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-white" />
              </div>
              <div className="pt-3 flex space-x-3">
                <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-slate-800 text-slate-200 rounded-xl text-sm">Cancel</button>
                <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium">Save</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    const EventDetailsModal = ({ event, onClose, onEdit, onDelete, onDuplicate }) => {
      if (!event) return null;
      const color = event.color || '#e11d48';

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-800 overflow-hidden">
            <div className="p-6 text-white" style={{ background: `linear-gradient(135deg, ${color}, #1e293b)` }}>
              <div className="flex justify-between items-center mb-2">
                <span className="px-2.5 py-1 bg-black/30 rounded-full text-xs font-semibold">{event.category}</span>
                <button onClick={onClose} className="p-1 rounded-full bg-black/30">✕</button>
              </div>
              <p className="text-xs font-bold uppercase tracking-widest">{event.game}</p>
              <h2 className="text-2xl font-bold mt-1">{event.title}</h2>
            </div>
            <div className="p-6 space-y-4">
              <div className="text-xs bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                <div>Start: {new Date(event.startDate).toLocaleString()}</div>
                <div>End: {new Date(event.endDate).toLocaleString()}</div>
              </div>
              {event.description && <p className="text-sm text-slate-300">{event.description}</p>}
              <div className="pt-4 border-t border-slate-800 flex justify-between">
                <div className="flex gap-2">
                  <button onClick={() => { onClose(); onEdit(event); }} className="px-3 py-1.5 bg-slate-800 text-yellow-300 rounded-lg text-xs">Edit</button>
                  <button onClick={() => { onClose(); onDuplicate(event); }} className="px-3 py-1.5 bg-slate-800 text-indigo-300 rounded-lg text-xs">Duplicate</button>
                </div>
                <button onClick={() => { onDelete(event.id); onClose(); }} className="px-3 py-1.5 bg-red-950 text-red-300 rounded-lg text-xs">Delete</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
