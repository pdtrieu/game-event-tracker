<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropTracker PRO - Shared Game Event & Battle Pass Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Custom scrollbar for dropdowns */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen bg-dark-900 text-slate-100 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-dark-800 p-6 rounded-2xl border border-dark-700 shadow-xl">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent flex items-center gap-3">
                    <i data-lucide="gamepad-2" class="w-8 h-8 text-indigo-400"></i> DropTracker PRO
                </h1>
                <p class="text-slate-400 text-sm mt-1 flex items-center">
                    Live multi-player battle pass & game event scheduler. 
                    <span id="syncStatus" class="flex items-center gap-1 text-xs px-2 py-0.5 bg-dark-700 rounded text-indigo-300 ml-2">
                        <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Connecting...
                    </span>
                </p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-dark-900 p-1 rounded-xl flex border border-dark-700">
                    <button id="tabTimers" onclick="switchView('timers')" class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg">
                        <i data-lucide="clock" class="w-4 h-4"></i> Timers
                    </button>
                    <button id="tabCalendar" onclick="switchView('calendar')" class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 text-slate-400 hover:text-white">
                        <i data-lucide="calendar" class="w-4 h-4"></i> Calendar
                    </button>
                </div>
                <button onclick="openModal()" class="bg-gradient-to-r from-indigo-500 to-pink-500 hover:from-indigo-600 hover:to-pink-600 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg transition flex items-center gap-2">
                    <i data-lucide="plus" class="w-5 h-5"></i> Add Event
                </button>
            </div>
        </header>

        <!-- Filters & Event Counter -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 bg-dark-800/60 p-4 rounded-xl border border-dark-700">
            <div class="flex flex-wrap gap-4 items-center">
                
                <!-- Multi-select Game Filter -->
                <div class="flex items-center gap-2 relative">
                    <span class="text-sm text-slate-400 font-medium">Game:</span>
                    <button id="gameFilterBtn" onclick="toggleGameDropdown(event)" class="bg-dark-900 border border-dark-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 flex items-center justify-between min-w-[140px]">
                        <span id="gameFilterText">All Games</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 ml-2 text-slate-500"></i>
                    </button>
                    <!-- Dropdown Panel -->
                    <div id="gameDropdown" class="hidden absolute top-full left-12 mt-1 w-56 bg-dark-800 border border-dark-700 rounded-xl shadow-2xl z-40 p-2 max-h-60 overflow-y-auto">
                        <div id="gameCheckboxList" class="flex flex-col gap-1">
                            <!-- Checkboxes injected here -->
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-400 font-medium">Category:</span>
                    <select id="filterCategory" onchange="render()" class="bg-dark-900 border border-dark-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500">
                        <option value="All">All</option>
                        <option value="Battle Pass">Battle Pass</option>
                        <option value="Event">Event</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-slate-400 font-medium">Status:</span>
                    <select id="filterStatus" onchange="render()" class="bg-dark-900 border border-dark-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500">
                        <option value="All">All</option>
                        <option value="Live">Live Now</option>
                        <option value="Upcoming">Upcoming</option>
                        <option value="Ended">Ended</option>
                    </select>
                </div>
            </div>
            <div id="eventCounter" class="text-xs font-semibold text-slate-400 bg-dark-900 px-3 py-1.5 rounded-lg border border-dark-700">
                Showing 0 of 0 events
            </div>
        </div>

        <!-- Views Container -->
        <div id="mainView"></div>
    </div>

    <!-- Modal (Add / Edit) -->
    <div id="eventModal" onclick="if(event.target === this) closeModal()" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-400"></i> Add New Event
                </h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleSaveEvent(event)" class="space-y-4">
                <input type="hidden" id="editEventId">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Game Name</label>
                    <input type="text" id="inputGame" required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Title</label>
                    <input type="text" id="inputTitle" required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Category</label>
                    <select id="inputCategory" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="Battle Pass">Battle Pass</option>
                        <option value="Event">Event</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Start</label>
                        <input type="datetime-local" id="inputStart" required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">End</label>
                        <input type="datetime-local" id="inputEnd" required class="w-full bg-dark-900 border border-dark-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Theme Color Palette</label>
                    <!-- Rainbow Ordered Palette -->
                    <div class="bg-dark-900 p-2.5 rounded-xl border border-dark-700 mb-3 grid grid-cols-6 gap-2">
                        <button type="button" onclick="setPresetColor('#ef4444')" class="w-full h-7 rounded-md bg-red-500 hover:scale-105 transition border border-white/25" title="Red"></button>
                        <button type="button" onclick="setPresetColor('#f97316')" class="w-full h-7 rounded-md bg-orange-500 hover:scale-105 transition border border-white/25" title="Orange"></button>
                        <button type="button" onclick="setPresetColor('#f59e0b')" class="w-full h-7 rounded-md bg-amber-500 hover:scale-105 transition border border-white/25" title="Amber"></button>
                        <button type="button" onclick="setPresetColor('#10b981')" class="w-full h-7 rounded-md bg-emerald-500 hover:scale-105 transition border border-white/25" title="Emerald"></button>
                        <button type="button" onclick="setPresetColor('#14b8a6')" class="w-full h-7 rounded-md bg-teal-500 hover:scale-105 transition border border-white/25" title="Teal"></button>
                        <button type="button" onclick="setPresetColor('#06b6d4')" class="w-full h-7 rounded-md bg-cyan-500 hover:scale-105 transition border border-white/25" title="Cyan"></button>
                        <button type="button" onclick="setPresetColor('#3b82f6')" class="w-full h-7 rounded-md bg-blue-500 hover:scale-105 transition border border-white/25" title="Blue"></button>
                        <button type="button" onclick="setPresetColor('#6366f1')" class="w-full h-7 rounded-md bg-indigo-500 hover:scale-105 transition border border-white/25" title="Indigo"></button>
                        <button type="button" onclick="setPresetColor('#a855f7')" class="w-full h-7 rounded-md bg-purple-500 hover:scale-105 transition border border-white/25" title="Purple"></button>
                        <button type="button" onclick="setPresetColor('#d946ef')" class="w-full h-7 rounded-md bg-fuchsia-500 hover:scale-105 transition border border-white/25" title="Fuchsia"></button>
                        <button type="button" onclick="setPresetColor('#ec4899')" class="w-full h-7 rounded-md bg-pink-500 hover:scale-105 transition border border-white/25" title="Pink"></button>
                        <button type="button" onclick="setPresetColor('#e11d48')" class="w-full h-7 rounded-md bg-rose-600 hover:scale-105 transition border border-white/25" title="Rose"></button>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="color" id="inputColor" value="#ef4444" class="w-12 h-10 bg-dark-900 border border-dark-700 rounded-lg cursor-pointer p-1">
                        <span id="colorHex" class="text-sm font-mono text-slate-300">#ef4444</span>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-dark-700 text-slate-300 hover:bg-dark-600">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Save Event
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Initialize Icons for static elements immediately
        lucide.createIcons();

        // XSS Sanitizer for user-provided text
        const escapeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCoy6QjqZVkY5BGjDSUjObcWUixTbBKa6o",
            authDomain: "game-event-tracker-83c26.firebaseapp.com",
            projectId: "game-event-tracker-83c26",
            storageBucket: "game-event-tracker-83c26.firebasestorage.app",
            messagingSenderId: "158518711242",
            appId: "1:158518711242:web:f1a20725007a1a4ad4b533",
            measurementId: "G-T2105PNB7N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.events = [];
        window.currentView = 'timers';
        window.currentDate = new Date();
        window.selectedGames = new Set(); // Empty means 'All Games'

        const colRef = collection(db, 'droptracker_events');

        onSnapshot(colRef, (snapshot) => {
            const loaded = [];
            snapshot.forEach((docSnap) => {
                loaded.push({ id: docSnap.id, ...docSnap.data() });
            });
            // Sort primarily by order property
            loaded.sort((a, b) => (a.order || 0) - (b.order || 0));
            window.events = loaded;
            updateGameDropdown();
            render();
            document.getElementById('syncStatus').innerHTML = '<i data-lucide="wifi" class="w-3 h-3 text-emerald-400"></i> <span class="text-emerald-400">Sync Active</span>';
            lucide.createIcons();
        }, (error) => {
            console.error("Firestore error:", error);
            document.getElementById('syncStatus').innerHTML = '<i data-lucide="wifi-off" class="w-3 h-3 text-rose-400"></i> <span class="text-rose-400">Sync Error</span>';
            lucide.createIcons();
        });

        // Click outside dropdown to close
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('gameDropdown');
            const btn = document.getElementById('gameFilterBtn');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            }
        });

        window.toggleGameDropdown = function(e) {
            e.stopPropagation();
            document.getElementById('gameDropdown').classList.toggle('hidden');
        }

        window.toggleGameSelection = function(game) {
            if (game === 'ALL') {
                window.selectedGames.clear();
            } else {
                if (window.selectedGames.has(game)) {
                    window.selectedGames.delete(game);
                } else {
                    window.selectedGames.add(game);
                }
            }
            updateGameDropdownUI();
            render();
        }

        function updateGameDropdown() {
            const games = [...new Set(window.events.map(e => e.game))].sort();
            
            // Clean up missing games from set
            const validGames = new Set(games);
            for (let g of window.selectedGames) {
                if (!validGames.has(g)) window.selectedGames.delete(g);
            }
            
            let html = `
                <label class="flex items-center gap-2 p-2 hover:bg-dark-700 rounded-lg cursor-pointer transition">
                    <input type="checkbox" ${window.selectedGames.size === 0 ? 'checked' : ''} onchange="toggleGameSelection('ALL')" class="rounded border-dark-600 bg-dark-900 text-indigo-500 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-sm font-medium text-slate-200">All Games</span>
                </label>
                <div class="h-px bg-dark-700 my-1"></div>
            `;

            games.forEach(g => {
                html += `
                <label class="flex items-center gap-2 p-2 hover:bg-dark-700 rounded-lg cursor-pointer transition">
                    <input type="checkbox" ${window.selectedGames.has(g) ? 'checked' : ''} onchange="toggleGameSelection('${escapeHTML(g)}')" class="rounded border-dark-600 bg-dark-900 text-indigo-500 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-sm text-slate-300 truncate">${escapeHTML(g)}</span>
                </label>`;
            });

            document.getElementById('gameCheckboxList').innerHTML = html;
            updateGameDropdownUI();
        }

        function updateGameDropdownUI() {
            const btnText = document.getElementById('gameFilterText');
            if (window.selectedGames.size === 0) {
                btnText.innerText = "All Games";
            } else if (window.selectedGames.size === 1) {
                btnText.innerText = [...window.selectedGames][0];
            } else {
                btnText.innerText = `${window.selectedGames.size} Games Selected`;
            }

            // Sync checkbox states visually
            const checkboxes = document.querySelectorAll('#gameCheckboxList input[type="checkbox"]');
            if(checkboxes.length > 0) {
                checkboxes[0].checked = window.selectedGames.size === 0;
                const games = [...new Set(window.events.map(e => e.game))].sort();
                games.forEach((g, idx) => {
                    if(checkboxes[idx + 1]) checkboxes[idx + 1].checked = window.selectedGames.has(g);
                });
            }
        }

        window.switchView = function(view) {
            window.currentView = view;
            const activeClass = 'px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg';
            const inactiveClass = 'px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 text-slate-400 hover:text-white';
            
            document.getElementById('tabTimers').className = view === 'timers' ? activeClass : inactiveClass;
            document.getElementById('tabCalendar').className = view === 'calendar' ? activeClass : inactiveClass;
            render();
        }

        window.openModal = function(id = null) {
            document.getElementById('eventModal').classList.remove('hidden');
            document.getElementById('eventModal').classList.add('flex');
            
            if (id) {
                const ev = window.events.find(e => e.id === id);
                if (ev) {
                    document.getElementById('modalTitle').innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 text-indigo-400"></i> Edit Event';
                    document.getElementById('editEventId').value = ev.id;
                    document.getElementById('inputGame').value = ev.game;
                    document.getElementById('inputTitle').value = ev.title;
                    document.getElementById('inputCategory').value = ev.category;
                    document.getElementById('inputStart').value = ev.startDate;
                    document.getElementById('inputEnd').value = ev.endDate;
                    document.getElementById('inputColor').value = ev.color || '#ef4444';
                    document.getElementById('colorHex').innerText = ev.color || '#ef4444';
                }
            } else {
                document.getElementById('modalTitle').innerHTML = '<i data-lucide="calendar-plus" class="w-5 h-5 text-indigo-400"></i> Add New Event';
                document.getElementById('editEventId').value = '';
                document.querySelector('form').reset();
                document.getElementById('inputColor').value = '#ef4444';
                document.getElementById('colorHex').innerText = '#ef4444';
            }
            lucide.createIcons();
        }

        window.closeModal = function() { 
            document.getElementById('eventModal').classList.remove('flex'); 
            document.getElementById('eventModal').classList.add('hidden'); 
        }

        window.setPresetColor = function(color) {
            document.getElementById('inputColor').value = color;
            document.getElementById('colorHex').innerText = color;
        }

        document.getElementById('inputColor').addEventListener('input', (e) => {
            document.getElementById('colorHex').innerText = e.target.value;
        });

        window.handleSaveEvent = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editEventId').value;
            const eventData = {
                game: document.getElementById('inputGame').value,
                title: document.getElementById('inputTitle').value,
                category: document.getElementById('inputCategory').value,
                startDate: document.getElementById('inputStart').value,
                endDate: document.getElementById('inputEnd').value,
                color: document.getElementById('inputColor').value,
            };

            if (editId) {
                await updateDoc(doc(db, 'droptracker_events', editId), eventData);
            } else {
                eventData.order = Date.now(); // Put new items at the end
                await addDoc(colRef, eventData);
            }
            closeModal();
        }

        window.handleDelete = async function(id) {
            await deleteDoc(doc(db, 'droptracker_events', id));
        }

        // Swaps the order values of two specifically targeted events within their rendered section
        window.handleSwap = async function(id1, id2) {
            if (!id2 || id2 === 'null') return;
            const ev1 = window.events.find(e => e.id === id1);
            const ev2 = window.events.find(e => e.id === id2);
            if (!ev1 || !ev2) return;

            const temp = ev1.order || 0;
            ev1.order = ev2.order || 0;
            ev2.order = temp;

            // Optimistic update
            render();

            await updateDoc(doc(db, 'droptracker_events', ev1.id), { order: ev1.order });
            await updateDoc(doc(db, 'droptracker_events', ev2.id), { order: ev2.order });
        }

        function renderEventCard(ev, i, sectionArray) {
            const now = Date.now();
            const start = new Date(ev.startDate).getTime();
            const end = new Date(ev.endDate).getTime();
            
            // Format End Date (e.g. "Oct 15")
            const endDateObj = new Date(ev.endDate);
            const endFormatted = endDateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

            let status = 'Starts In', time = start - now, isLive = false, prog = 0;
            
            if (now >= start && now <= end) { 
                status = 'Ends In'; time = end - now; isLive = true; 
                prog = Math.min(100, Math.max(0, ((now - start)/(end - start))*100)); 
            } else if (now > end) { 
                status = 'Completed'; time = 0; prog = 100; 
            }

            const d = Math.floor(time / 86400000);
            const h = Math.floor((time % 86400000) / 3600000);
            const m = Math.floor((time % 3600000) / 60000);
            const s = Math.floor((time % 60000) / 1000);

            // Get ids for swapping within the same section display to keep it robust
            const prevId = i > 0 ? sectionArray[i-1].id : null;
            const nextId = i < sectionArray.length - 1 ? sectionArray[i+1].id : null;

            return `
            <div class="bg-dark-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between" style="border: 1px solid ${ev.color}40; border-top: 4px solid ${ev.color};">
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-xs font-bold uppercase px-2.5 py-1 rounded-md bg-dark-900 border border-dark-700" style="color: ${ev.color}">${escapeHTML(ev.game)}</span>
                            <span class="text-xs ml-2 px-2 py-0.5 rounded bg-dark-700/50 font-medium" style="color: ${ev.color}">${ev.category}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <div class="flex flex-col">
                                <button onclick="handleSwap('${ev.id}', '${prevId}')" ${!prevId ? 'disabled class="opacity-30"' : 'class="text-slate-500 hover:text-white transition"'} title="Move Up"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                                <button onclick="handleSwap('${ev.id}', '${nextId}')" ${!nextId ? 'disabled class="opacity-30"' : 'class="text-slate-500 hover:text-white transition"'} title="Move Down"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                            </div>
                            <button onclick="openModal('${ev.id}')" class="text-slate-500 hover:text-indigo-400 p-1.5 transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="handleDelete('${ev.id}')" class="text-slate-500 hover:text-rose-400 p-1.5 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2">${escapeHTML(ev.title)}</h3>
                    <div class="bg-dark-900/80 rounded-xl p-3 border border-dark-700/60 my-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold uppercase text-slate-400 flex items-center gap-1.5">
                                ${status}
                                <span class="text-[11px] font-normal text-slate-300 bg-dark-800 px-1.5 py-0.5 rounded border border-dark-700 flex items-center gap-1" title="End Date">
                                    <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i> ${endFormatted}
                                </span>
                            </span>
                            <span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase flex items-center gap-1 ${isLive ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${isLive ? '<i data-lucide="play-circle" class="w-3 h-3"></i> Live' : '<i data-lucide="clock" class="w-3 h-3"></i> Upcoming'}
                            </span>
                        </div>
                        ${now > end ? '<div class="text-sm font-bold text-rose-400 py-1">Event Ended</div>' : `
                        <div class="grid grid-cols-4 gap-1 text-center font-mono">
                            <div class="bg-dark-800 p-1.5 rounded-lg border border-dark-700"><div class="text-base font-bold text-white">${d}</div><div class="text-[9px] text-slate-400">Days</div></div>
                            <div class="bg-dark-800 p-1.5 rounded-lg border border-dark-700"><div class="text-base font-bold text-white">${String(h).padStart(2,'0')}</div><div class="text-[9px] text-slate-400">Hrs</div></div>
                            <div class="bg-dark-800 p-1.5 rounded-lg border border-dark-700"><div class="text-base font-bold text-white">${String(m).padStart(2,'0')}</div><div class="text-[9px] text-slate-400">Mins</div></div>
                            <div class="bg-dark-800 p-1.5 rounded-lg border border-dark-700"><div class="text-base font-bold text-white">${String(s).padStart(2,'0')}</div><div class="text-[9px] text-slate-400">Secs</div></div>
                        </div>`}
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-1"><span>Progress</span><span class="text-white font-bold">${Math.round(prog)}%</span></div>
                    <div class="w-full bg-dark-900 h-2 rounded-full overflow-hidden border border-dark-700">
                        <div class="h-full" style="width: ${prog}%; background-color: ${ev.color}"></div>
                    </div>
                </div>
            </div>`;
        }

        window.render = function() {
            const catFilter = document.getElementById('filterCategory').value;
            const statusFilter = document.getElementById('filterStatus').value;
            const now = Date.now();

            const filtered = window.events.filter(e => {
                const matchGame = window.selectedGames.size === 0 || window.selectedGames.has(e.game);
                const matchCat = catFilter === 'All' || e.category === catFilter;
                
                const isLiveNow = now >= new Date(e.startDate).getTime() && now <= new Date(e.endDate).getTime();
                const isUpcomingNow = now < new Date(e.startDate).getTime();
                const isEndedNow = now > new Date(e.endDate).getTime();

                let matchStatus = true;
                if (statusFilter === 'Live') matchStatus = isLiveNow;
                else if (statusFilter === 'Upcoming') matchStatus = isUpcomingNow;
                else if (statusFilter === 'Ended') matchStatus = isEndedNow;

                return matchGame && matchCat && matchStatus;
            });

            document.getElementById('eventCounter').innerText = `Showing ${filtered.length} of ${window.events.length} events`;
            const container = document.getElementById('mainView');

            if (window.currentView === 'timers') {
                if (filtered.length === 0) {
                    container.innerHTML = `<div class="text-center py-20 bg-dark-800/40 rounded-2xl border border-dark-700"><i data-lucide="gamepad" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i><h3 class="text-lg font-medium text-slate-300">No events found</h3></div>`;
                } else {
                    const liveEvents = filtered.filter(e => now >= new Date(e.startDate).getTime() && now <= new Date(e.endDate).getTime());
                    const upcomingEvents = filtered.filter(e => now < new Date(e.startDate).getTime());
                    const endedEvents = filtered.filter(e => now > new Date(e.endDate).getTime());

                    let html = '';
                    if (liveEvents.length > 0) {
                        html += `<div class="mb-8"><h2 class="text-xl font-bold text-emerald-400 mb-4 flex items-center gap-2"><i data-lucide="radio" class="w-5 h-5 animate-pulse"></i> Live Now</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                        html += liveEvents.map((ev, i) => renderEventCard(ev, i, liveEvents)).join('');
                        html += `</div></div>`;
                    }
                    if (upcomingEvents.length > 0) {
                        html += `<div class="mb-8"><h2 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5"></i> Upcoming</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                        html += upcomingEvents.map((ev, i) => renderEventCard(ev, i, upcomingEvents)).join('');
                        html += `</div></div>`;
                    }
                    if (endedEvents.length > 0) {
                        html += `<div class="mb-8"><h2 class="text-xl font-bold text-slate-400 mb-4 flex items-center gap-2"><i data-lucide="check-circle-2" class="w-5 h-5"></i> Ended</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                        html += endedEvents.map((ev, i) => renderEventCard(ev, i, endedEvents)).join('');
                        html += `</div></div>`;
                    }
                    container.innerHTML = html;
                }
            } else {
                const year = window.currentDate.getFullYear();
                const month = window.currentDate.getMonth();
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const firstDay = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();
                
                // Get accurate local 'today' for highlighting
                const todayObj = new Date();
                const isCurrentMonthYear = todayObj.getFullYear() === year && todayObj.getMonth() === month;
                const todayDate = todayObj.getDate();

                let daysHTML = '';
                for (let i = 0; i < firstDay; i++) daysHTML += `<div class="h-28 bg-dark-900/30 rounded-xl"></div>`;
                for (let d = 1; d <= totalDays; d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const dayEvs = filtered.filter(ev => dateStr >= ev.startDate.split('T')[0] && dateStr <= ev.endDate.split('T')[0]);
                    const isToday = isCurrentMonthYear && todayDate === d;

                    daysHTML += `
                    <div class="h-28 bg-dark-900/70 border rounded-xl p-2 flex flex-col overflow-y-auto ${isToday ? 'border-indigo-500 ring-1 ring-indigo-500' : 'border-dark-700'}">
                        <div class="text-right text-xs font-semibold text-slate-400 mb-1">${d}</div>
                        <div class="space-y-1 flex-1">
                            ${dayEvs.map(ev => `<div class="text-[10px] px-1.5 py-0.5 rounded truncate font-medium text-white shadow cursor-pointer transition hover:opacity-80" onclick="openModal('${ev.id}')" style="background-color: ${ev.color}"><span class="opacity-75">${escapeHTML(ev.game)}:</span>${escapeHTML(ev.title)}</div>`).join('')}
                        </div>
                    </div>`;
                }

                container.innerHTML = `
                <div class="bg-dark-800 border border-dark-700 rounded-2xl p-6 shadow-xl">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="calendar" class="w-5 h-5 text-indigo-400"></i> ${monthNames[month]} ${year}</h2>
                        <div class="flex gap-2">
                            <button onclick="window.currentDate.setMonth(window.currentDate.getMonth()-1); render();" class="p-2 bg-dark-900 border border-dark-700 rounded-xl hover:bg-dark-700 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                            <button onclick="window.currentDate.setMonth(window.currentDate.getMonth()+1); render();" class="p-2 bg-dark-900 border border-dark-700 rounded-xl hover:bg-dark-700 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-2 mb-2 text-center">
                        ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="text-xs font-bold text-slate-400 uppercase py-1">${d}</div>`).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-2">${daysHTML}</div>
                </div>`;
            }
            lucide.createIcons();
        }

        setInterval(() => { if (window.currentView === 'timers') render(); }, 1000);
    </script>
</body>
</html>
