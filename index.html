                            React.createElement('div', { className: 'text-right text-xs font-semibold text-slate-400 mb-1' }, dateObj.getDate()),
                            React.createElement('div', { className: 'space-y-1 flex-1' },
                                dayEvents.map(ev => React.createElement('div', { key: ev.id, title: `${ev.game}: ${ev.title}`, className: 'text-[10px] px-1.5 py-0.5 rounded truncate font-medium text-white shadow', style: { backgroundColor: ev.color } },
                                    React.createElement('span', { className: 'opacity-75' }, `${ev.game}: `), ev.title
                                ))
                            )
                        );
                    })
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
